<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGO WeDo 2.0 — Академия робототехники (36 занятий + PRO)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E3000B;
    --yellow: #FFD700;
    --blue: #006CB7;
    --green: #00A650;
    --orange: #FF6B00;
    --purple: #7B2D8B;
    --pink: #E91E8C;
    --gold: #F9A825;
    --bg: #F4F6FB;
    --card-bg: #FFFFFF;
    --text-main: #1C2536;
    --text-muted: #616E85;
    --shadow: 0 8px 24px rgba(0, 30, 80, 0.08);
    --shadow-hover: 0 16px 36px rgba(0, 30, 80, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    padding-bottom: 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #0E1E38 0%, #1A365D 100%);
    color: #fff;
    padding: 30px 20px 35px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(14,30,56,0.3);
  }

  .studs-pattern {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0.07;
    background-image: radial-gradient(#fff 2px, transparent 2px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  .header-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-lego {
    background: var(--red);
    color: #fff;
    font-family: 'Baloo 2', sans-serif;
    font-size: 28px;
    font-weight: 800;
    padding: 4px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(227,0,11,0.4);
    letter-spacing: 1px;
    border: 2px solid #FFD700;
  }

  .site-title h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.1;
  }

  .site-title p {
    font-size: 14px;
    color: #94A3B8;
    margin-top: 2px;
  }

  .header-badges {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge-chip {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(4px);
  }

  .badge-chip.pro {
    background: linear-gradient(135deg, var(--red) 0%, #FF6B00 100%);
    border: none;
    box-shadow: 0 4px 12px rgba(227,0,11,0.3);
  }

  /* ── CONTROLS / FILTERS ── */
  .controls-wrapper {
    max-width: 1200px;
    margin: -20px auto 25px;
    padding: 0 20px;
    position: relative;
    z-index: 10;
  }

  .controls-card {
    background: #fff;
    border-radius: 20px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .search-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .search-input-wrapper {
    position: relative;
    flex: 1;
  }

  .search-input-wrapper input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border-radius: 14px;
    border: 2px solid #E2E8F0;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }

  .search-input-wrapper input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0,108,183,0.15);
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: #94A3B8;
  }

  .module-filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .module-filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    padding: 8px 16px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: #F1F5F9;
    color: #475569;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .filter-btn:hover {
    background: #E2E8F0;
  }

  .filter-btn.active {
    background: #0E1E38;
    color: #fff;
    box-shadow: 0 4px 12px rgba(14,30,56,0.25);
  }

  .filter-btn.pro-btn {
    background: #FFF1F2;
    color: #E11D48;
    border: 1px solid #FECDD3;
  }

  .filter-btn.pro-btn.active {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }

  /* ── GRID OF LESSON CARDS ── */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
    display: flex;
    flex-direction: column;
    cursor: pointer;
    border: 2px solid transparent;
    position: relative;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-hover);
    border-color: #CBD5E1;
  }

  .card-banner {
    height: 160px;
    background: #EEF2F6;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .card-banner img {
    width: 85%;
    height: 85%;
    object-fit: contain;
    transition: transform 0.3s;
  }

  .card:hover .card-banner img {
    transform: scale(1.08);
  }

  .card-module-tag {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .card-num-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(14,30,56,0.85);
    color: #fff;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    backdrop-filter: blur(4px);
  }

  .card-fast-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: #FEF3C7;
    color: #92400E;
    border: 1px solid #FDE68A;
    padding: 3px 8px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .card-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .card-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
    padding-top: 10px;
  }

  .card-tag {
    background: #F1F5F9;
    color: #475569;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
  }

  .card-action {
    margin-top: 12px;
    background: #F8FAFC;
    border-top: 1px solid #E2E8F0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 800;
    font-size: 13px;
    color: var(--blue);
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(14, 30, 56, 0.65);
    backdrop-filter: blur(8px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: #fff;
    border-radius: 24px;
    width: 100%;
    max-width: 820px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    position: relative;
    animation: modalIn 0.25s cubic-bezier(.175,.885,.32,1.275);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(15px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-header-hero {
    height: 220px;
    background: linear-gradient(135deg, #0E1E38 0%, #1E3A8A 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-header-hero img {
    max-height: 180px;
    max-width: 85%;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
  }

  .modal-close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    color: #fff;
    border: none;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 10;
  }

  .modal-close-btn:hover {
    background: var(--red);
    transform: rotate(90deg);
  }

  .modal-content {
    padding: 26px 30px 32px;
  }

  .modal-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .modal-badge {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
  }

  .modal-lesson-num {
    font-weight: 800;
    color: #94A3B8;
    font-size: 14px;
  }

  .modal-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.15;
    margin-bottom: 6px;
  }

  .modal-goal-box {
    background: #EFF6FF;
    border-left: 4px solid var(--blue);
    padding: 12px 16px;
    border-radius: 0 12px 12px 0;
    margin: 16px 0 20px;
    font-size: 14px;
    color: #1E3A8A;
    line-height: 1.45;
  }

  /* PDF CTA BUTTONS */
  .pdf-cta-box {
    margin: 16px 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn-pdf {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--red) 0%, #B70008 100%);
    color: #fff;
    padding: 12px 20px;
    border-radius: 14px;
    font-family: inherit;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(227, 0, 11, 0.3);
    transition: all 0.2s;
  }

  .btn-pdf:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(227, 0, 11, 0.45);
    background: linear-gradient(135deg, #FF1722 0%, var(--red) 100%);
  }

  .btn-pdf-pro {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    color: #fff;
    padding: 12px 20px;
    border-radius: 14px;
    font-family: inherit;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(217, 119, 6, 0.3);
    transition: all 0.2s;
  }

  .btn-pdf-pro:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(217, 119, 6, 0.45);
    background: linear-gradient(135deg, #FBBF24 0%, #D97706 100%);
  }

  /* MODAL TABS */
  .modal-tabs {
    display: flex;
    gap: 8px;
    border-bottom: 2px solid #E2E8F0;
    margin-bottom: 20px;
    overflow-x: auto;
  }

  .modal-tab-btn {
    padding: 10px 14px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    color: #64748B;
    cursor: pointer;
    position: relative;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .modal-tab-btn.active {
    color: var(--blue);
  }

  .modal-tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0; right: 0;
    height: 3px;
    background: var(--blue);
    border-radius: 3px 3px 0 0;
  }

  .modal-tab-btn.tab-fast {
    color: #D97706;
  }

  .modal-tab-btn.tab-fast.active {
    color: #B45309;
  }

  .modal-tab-btn.tab-fast.active::after {
    background: #F59E0B;
  }

  .tab-pane {
    display: none;
  }

  .tab-pane.active {
    display: block;
    animation: fadeIn 0.2s;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .point-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .point-list li {
    position: relative;
    padding-left: 28px;
    font-size: 15px;
    line-height: 1.5;
    color: #334155;
  }

  .point-list li::before {
    content: '🔹';
    position: absolute;
    left: 0;
    top: 0;
    font-size: 14px;
  }

  .prog-box {
    background: #0E1E38;
    color: #E2E8F0;
    padding: 16px 20px;
    border-radius: 14px;
    font-family: 'Baloo 2', monospace;
    font-size: 16px;
    letter-spacing: 0.5px;
    border-left: 5px solid #FFD700;
    margin-top: 8px;
  }

  /* FAST TRACK CARDS */
  .fast-card {
    background: #FFFBEB;
    border: 2px solid #FDE68A;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .fast-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 17px;
    font-weight: 800;
    color: #92400E;
    margin-bottom: 8px;
  }

  .fast-card-body {
    font-size: 15px;
    color: #78350F;
    line-height: 1.55;
  }

  /* FOOTER */
  footer {
    text-align: center;
    margin-top: 50px;
    color: #94A3B8;
    font-size: 13px;
  }

  footer a {
    color: var(--blue);
    text-decoration: none;
    font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <div class="studs-pattern"></div>
  <div class="header-container">
    <div class="brand">
      <div class="logo-lego">LEGO</div>
      <div class="site-title">
        <h1>WeDo 2.0 — Академия робототехники</h1>
        <p>Годовой курс для юных инженеров · 36 основных занятий + 6 PRO-проектов</p>
      </div>
    </div>
    <div class="header-badges">
      <div class="badge-chip">🤖 36 базовых уроков</div>
      <div class="badge-chip pro">⭐ 6 PRO-проектов</div>
      <div class="badge-chip">⚙️ Базовый набор 45300</div>
    </div>
  </div>
</header>

<div class="controls-wrapper">
  <div class="controls-card">
    <div class="search-row">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск занятия, модели, механизма (например: червяк, майло, кран, спирограф)...">
      </div>
    </div>
    <div class="module-filters" id="moduleFilters">
      <button class="filter-btn active" data-mod="all">📦 Все (42)</button>
      <button class="filter-btn" data-mod="1">🔷 Модуль 1: Механизмы и датчики (6)</button>
      <button class="filter-btn" data-mod="2">🟠 Модуль 2: Передачи (6)</button>
      <button class="filter-btn" data-mod="3">🟢 Модуль 3: Транспорт (6)</button>
      <button class="filter-btn" data-mod="4">🌸 Модуль 4: Бионика (6)</button>
      <button class="filter-btn" data-mod="5">🔬 Модуль 5: Наука и город (6)</button>
      <button class="filter-btn" data-mod="6">🏆 Модуль 6: Хакатон и проекты (6)</button>
      <button class="filter-btn pro-btn" data-mod="7">⭐ PRO: Для быстрых (6)</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="grid" id="lessonsGrid">
    <!-- Cards rendered via JS -->
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <button class="modal-close-btn" id="modalClose">✕</button>
    <div class="modal-header-hero" id="modalHero">
      <img id="modalHeroImg" src="" alt="Robot model">
    </div>
    <div class="modal-content">
      <div class="modal-meta-row">
        <span class="modal-badge" id="modalBadge"></span>
        <span class="modal-lesson-num" id="modalLessonNum"></span>
      </div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-goal-box" id="modalGoal"></div>

      <div class="pdf-cta-box" id="modalPdfCta">
        <!-- Rendered if PDF exists -->
      </div>

      <div class="modal-tabs">
        <button class="modal-tab-btn active" data-tab="theory">💡 Что и почему работает</button>
        <button class="modal-tab-btn" data-tab="build">🧩 Сборка и подсказки</button>
        <button class="modal-tab-btn" data-tab="prog">💻 Программа WeDo 2.0</button>
        <button class="modal-tab-btn tab-fast" data-tab="fast">⚡ Для быстрых учеников</button>
        <button class="modal-tab-btn" data-tab="exp">🎯 Челленджи</button>
      </div>

      <div class="tab-pane active" id="tab-theory">
        <ul class="point-list" id="modalTheoryList"></ul>
      </div>
      <div class="tab-pane" id="tab-build">
        <ul class="point-list" id="modalBuildList"></ul>
      </div>
      <div class="tab-pane" id="tab-prog">
        <div class="prog-box" id="modalProgText"></div>
      </div>
      <div class="tab-pane" id="tab-fast">
        <div id="modalFastContent"></div>
      </div>
      <div class="tab-pane" id="tab-exp">
        <ul class="point-list" id="modalExpList"></ul>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>LEGO® WeDo 2.0 — Академия робототехники · Разработано для юных инженеров</p>
</footer>

<script>

const MODULES = {"1": {"name": "Первые механизмы и датчики", "color": "#006CB7", "badge": "🔷 Модуль 1"}, "2": {"name": "Механика и передачи", "color": "#FF6B00", "badge": "🟠 Модуль 2"}, "3": {"name": "Транспорт и спецтехника", "color": "#00A650", "badge": "🟢 Модуль 3"}, "4": {"name": "Бионика: роботы-животные", "color": "#E91E8C", "badge": "🌸 Модуль 4"}, "5": {"name": "Наука, экология и умный город", "color": "#7B2D8B", "badge": "🔬 Модуль 5"}, "6": {"name": "Автономные системы и хакатон", "color": "#F9A825", "badge": "🏆 Модуль 6"}, "7": {"name": "Бонусные PRO-уроки для быстрых", "color": "#E3000B", "badge": "⭐ PRO-модуль"}};

let activeMod = 'all';
let searchQuery = '';

const grid = document.getElementById('lessonsGrid');
const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');

function renderCards() {
  grid.innerHTML = '';
  const filtered = LESSONS.filter(l => {
    const modMatch = (activeMod === 'all' || l.m == activeMod);
    const text = (l.title + ' ' + l.subtitle + ' ' + l.concept + ' ' + (l.tags || []).join(' ')).toLowerCase();
    const searchMatch = !searchQuery || text.includes(searchQuery.toLowerCase());
    return modMatch && searchMatch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748B;">Ничего не найдено 🔍</div>';
    return;
  }

  filtered.forEach(lesson => {
    const mod = MODULES[lesson.m];
    const card = document.createElement('div');
    card.className = 'card';
    const isProMod = lesson.m === 7;
    card.innerHTML = `
      <div class="card-banner" style="background: ${mod.color}10">
        <span class="card-module-tag" style="background: ${mod.color}">${mod.badge}</span>
        <span class="card-num-tag">${isProMod ? 'PRO ' + (lesson.num - 36) : 'Занятие ' + lesson.num}</span>
        ${lesson.fast_track && lesson.fast_track.pro_pdf ? '<span class="card-fast-badge">⚡ Есть PRO-схема</span>' : ''}
        <img src="${lesson.img}" alt="${lesson.title}" onerror="this.src='images/455.png'">
      </div>
      <div class="card-body">
        <h3 class="card-title">${lesson.emoji} ${lesson.title}</h3>
        <p class="card-subtitle">${lesson.subtitle}</p>
        <div class="card-tags">
          ${lesson.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="card-action">
        <span>Открыть занятие</span>
        <span>→</span>
      </div>
    `;
    card.onclick = () => openModal(lesson);
    grid.appendChild(card);
  });
}

function openModal(lesson) {
  const mod = MODULES[lesson.m];
  document.getElementById('modalBadge').textContent = mod.badge;
  document.getElementById('modalBadge').style.background = mod.color;
  document.getElementById('modalLessonNum').textContent = lesson.m === 7 ? `Бонусный проект PRO-${lesson.num - 36}` : `Занятие №${lesson.num} из 36`;
  document.getElementById('modalTitle').textContent = `${lesson.emoji} ${lesson.title}`;
  document.getElementById('modalHeroImg').src = lesson.img;
  document.getElementById('modalHero').style.background = `linear-gradient(135deg, ${mod.color} 0%, #0E1E38 100%)`;

  document.getElementById('modalGoal').innerHTML = `<strong>🎯 Цель занятия:</strong> ${lesson.goal}<br><strong style="margin-top:4px;display:inline-block">🔬 Главное понятие:</strong> ${lesson.concept}`;

  const ctaBox = document.getElementById('modalPdfCta');
  let ctaHtml = '';
  if (lesson.pdf) {
    ctaHtml += `
      <a href="${lesson.pdf}" target="_blank" class="btn-pdf">
        <span style="font-size:18px">📖</span>
        <span>Базовая схема (PDF)</span>
      </a>
    `;
  }
  if (lesson.fast_track && lesson.fast_track.pro_pdf) {
    ctaHtml += `
      <a href="${lesson.fast_track.pro_pdf}" target="_blank" class="btn-pdf-pro">
        <span style="font-size:18px">⭐</span>
        <span>PRO-схема для быстрых (PDF)</span>
      </a>
    `;
  }
  if (!lesson.pdf && !lesson.fast_track?.pro_pdf) {
    ctaHtml = `
      <div style="background:#FEF3C7; color:#92400E; padding:12px 16px; border-radius:12px; font-weight:700; font-size:14px">
        💡 Авторский творческий проект: модель создается по собственному чертежу и эскизу!
      </div>
    `;
  }
  ctaBox.innerHTML = ctaHtml;

  // Lists
  document.getElementById('modalTheoryList').innerHTML = lesson.theory.map(t => `<li>${t}</li>`).join('');
  document.getElementById('modalBuildList').innerHTML = lesson.build_tips.map(b => `<li>${b}</li>`).join('');
  document.getElementById('modalProgText').textContent = lesson.prog;
  document.getElementById('modalExpList').innerHTML = lesson.exp.map(e => `<li>${e}</li>`).join('');

  // Fast track tab content
  const ft = lesson.fast_track || {};
  let fastHtml = '';
  if (ft.upgrade) {
    fastHtml += `
      <div class="fast-card">
        <div class="fast-card-header">
          <span>🥇</span>
          <span>Уровень 1: Инженерный апгрейд базовой модели</span>
        </div>
        <div class="fast-card-body">${ft.upgrade}</div>
      </div>
    `;
  }
  if (ft.pro_pdf) {
    fastHtml += `
      <div class="fast-card" style="background:#FFF7ED; border-color:#FFEDD5">
        <div class="fast-card-header" style="color:#C2410C">
          <span>🚀</span>
          <span>Уровень 2: Усложненная PRO-сборка</span>
        </div>
        <div class="fast-card-body" style="color:#9A3412">
          Собрал базу быстрее всех? Переходи на новый уровень сложности: <strong>${ft.pro_title}</strong>!
          <div style="margin-top:12px">
            <a href="${ft.pro_pdf}" target="_blank" class="btn-pdf-pro">
              <span>📖 Открыть инструкцию ${ft.pro_title}</span>
            </a>
          </div>
        </div>
      </div>
    `;
  }
  if (!ft.upgrade && !ft.pro_pdf) {
    fastHtml = '<div style="color:#64748B; padding:16px;">Придумай собственную модификацию механизма и удиви преподавателя!</div>';
  }
  document.getElementById('modalFastContent').innerHTML = fastHtml;

  // Reset tab to first
  switchTab('theory');

  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

modalClose.onclick = closeModal;
modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

// Tabs logic
document.querySelectorAll('.modal-tab-btn').forEach(btn => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

function switchTab(tabId) {
  document.querySelectorAll('.modal-tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabId);
  });
  document.querySelectorAll('.tab-pane').forEach(p => {
    p.classList.toggle('active', p.id === 'tab-' + tabId);
  });
}

// Filters logic
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeMod = btn.dataset.mod;
    renderCards();
  };
});

// Search logic
document.getElementById('searchInput').oninput = (e) => {
  searchQuery = e.target.value;
  renderCards();
};

// Initial render
renderCards();
</script>
